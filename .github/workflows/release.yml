name: Release APK

# APK assets: Releases → latest (обновляется с main) и отдельные версии v*
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk zairkey.apk

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: zairkey.apk
          generate_release_notes: true

      - name: Create latest release if missing
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 \\
            || gh release create latest --title "Zairkey APK" --notes "Актуальная APK-сборка из main." --prerelease

      - name: Update latest APK asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest zairkey.apk --clobber
          gh release edit latest --notes "Собрано: $(date '+%Y-%m-%d %H:%M UTC'), коммит ${GITHUB_SHA::7}."
